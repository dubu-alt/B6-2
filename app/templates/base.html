<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}공부 기록 블로그{% endblock %}</title>
  <style>
    :root { --text: #222; --muted: #777; --line: #e5e5e5; --point: #2f6fed; --error: #d93025; --bg-soft: #f6f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: #fff; line-height: 1.7;
           font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    a { color: var(--point); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid var(--line); }
    header .inner, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header .inner { display: flex; justify-content: space-between; align-items: center; height: 60px; }
    header .logo { font-weight: 700; font-size: 1.15rem; color: var(--text); }
    header nav a { margin-left: 16px; }
    main { padding-top: 32px; padding-bottom: 64px; }
    h1 { font-size: 1.8rem; line-height: 1.3; margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: .9rem; }
    .btn { display: inline-block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px;
           background: #fff; color: var(--text); font: inherit; font-size: .95rem; line-height: 1.5; cursor: pointer; }
    .btn:hover { background: var(--bg-soft); text-decoration: none; }
    .btn-primary { background: var(--point); border-color: var(--point); color: #fff; }
    .btn-primary:hover { background: #2259c9; }
    .btn-danger { color: var(--error); border-color: var(--error); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 32px; }
    .actions form { margin: 0; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--bg-soft);
           color: var(--muted); font-size: .85rem; }
    .tag.active { background: var(--point); color: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a class="logo" href="/">📚 공부 기록</a>
      <nav><a href="/posts">글 목록</a><a href="/posts/new">새 글 쓰기</a></nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
