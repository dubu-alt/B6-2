<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>서버 안과 바깥의 요청 흐름</title>
  <desc>브라우저 요청이 uvicorn, routers, services, repositories, database.db 순으로 내려가고, routers는 templates, services는 schemas, repositories는 models를 가져다 쓴다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; }
      .arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
      .layer rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
      .layer .t { fill: #085041; } .layer .s { fill: #0F6E56; }
      .tool rect { fill: #F1EFE8; stroke: #888780; stroke-width: 0.8; }
      .tool .t { fill: #2C2C2A; } .tool .s { fill: #5F5E5A; }
      .label { fill: #5F5E5A; }
    </style>
  </defs>
  <rect width="680" height="520" fill="#FFFFFF"/>

  <g class="tool"><rect x="40" y="72" width="140" height="56" rx="8"/>
    <text class="t" x="110" y="96" text-anchor="middle">브라우저</text>
    <text class="s" x="110" y="116" text-anchor="middle">서버 바깥</text></g>
  <text class="s label" x="210" y="84" text-anchor="middle">요청</text>
  <line class="arr" x1="182" y1="92" x2="236" y2="92" marker-end="url(#a)"/>
  <line class="arr" x1="238" y1="110" x2="184" y2="110" marker-end="url(#a)"/>
  <text class="s label" x="210" y="128" text-anchor="middle">응답</text>

  <rect x="226" y="30" width="414" height="440" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text class="t" x="246" y="57" fill="#3C3489">서버 안 (FastAPI 앱)</text>

  <g class="layer"><rect x="240" y="72" width="210" height="56" rx="8"/>
    <text class="t" x="345" y="96" text-anchor="middle">uvicorn + main.py</text>
    <text class="s" x="345" y="116" text-anchor="middle">요청 받아 앱에 전달</text></g>
  <g class="layer"><rect x="240" y="156" width="210" height="56" rx="8"/>
    <text class="t" x="345" y="180" text-anchor="middle">routers/</text>
    <text class="s" x="345" y="200" text-anchor="middle">요청·응답, 화면 선택</text></g>
  <g class="layer"><rect x="240" y="240" width="210" height="56" rx="8"/>
    <text class="t" x="345" y="264" text-anchor="middle">services/</text>
    <text class="s" x="345" y="284" text-anchor="middle">규칙 판단 (검증)</text></g>
  <g class="layer"><rect x="240" y="324" width="210" height="56" rx="8"/>
    <text class="t" x="345" y="348" text-anchor="middle">repositories/</text>
    <text class="s" x="345" y="368" text-anchor="middle">DB 읽기·쓰기</text></g>
  <g class="tool"><rect x="240" y="408" width="210" height="44" rx="8"/>
    <text class="t" x="345" y="435" text-anchor="middle">database.db</text></g>

  <g class="tool"><rect x="476" y="156" width="150" height="56" rx="8"/>
    <text class="t" x="551" y="180" text-anchor="middle">templates/</text>
    <text class="s" x="551" y="200" text-anchor="middle">HTML 완성</text></g>
  <g class="tool"><rect x="476" y="240" width="150" height="56" rx="8"/>
    <text class="t" x="551" y="264" text-anchor="middle">schemas/</text>
    <text class="s" x="551" y="284" text-anchor="middle">포장 상자 (DTO)</text></g>
  <g class="tool"><rect x="476" y="324" width="150" height="56" rx="8"/>
    <text class="t" x="551" y="348" text-anchor="middle">models/</text>
    <text class="s" x="551" y="368" text-anchor="middle">테이블 설계도</text></g>

  <line class="arr" x1="452" y1="184" x2="474" y2="184" marker-end="url(#a)"/>
  <line class="arr" x1="452" y1="268" x2="474" y2="268" marker-end="url(#a)"/>
  <line class="arr" x1="452" y1="352" x2="474" y2="352" marker-end="url(#a)"/>
  <line class="arr" x1="345" y1="130" x2="345" y2="154" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="arr" x1="345" y1="214" x2="345" y2="238" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="arr" x1="345" y1="298" x2="345" y2="322" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="arr" x1="345" y1="382" x2="345" y2="406" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="240" y="490" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="s label" x="262" y="501">요청이 지나가는 층</text>
  <rect x="420" y="490" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text class="s label" x="442" y="501">층이 가져다 쓰는 도구</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
